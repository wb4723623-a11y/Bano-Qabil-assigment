<!DOCTYPE html>
<html>

<head>
    <title>Application Form</title>
</head>

<body>

<center>

<form>

<h1>Application Form</h1>

<h1>General Information</h1>

<label>Name:</label>
<input type="text" name="name">

<label>Date of Birth:</label>
<input type="date" name="dob">

<br><br>

<label>Gender:</label>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female

<br><br>

<label>Address:</label>
<textarea name="address" rows="3" cols="40"></textarea>

<br><br>

<label>Phone Number:</label>
<input type="text" name="phone">

<label>Email:</label>
<input type="email" name="email">

<br><br>

<label>CNIC Number:</label>
<input type="text" name="cnic">

<br><br>

<label>Marital Status:</label>
<select>
    <option>Select</option>
    <option>Single</option>
    <option>Married</option>
</select>

<label>Occupation:</label>
<input type="text" name="occupation">

<br><br>

<label>Are you a smoker?</label>
<input type="radio" name="smoker"> Yes
<input type="radio" name="smoker"> No


<br>

<h1>Type of Health Coverage</h1>

<label>Employee Coverage:</label>
<input type="text">

<br><br>

<label>Employee Plan Choice:</label>
<select>
    <option>Select plan</option>
    <option>Basic</option>
    <option>Standard</option>
    <option>Premium</option>
</select>

<br><br>

<label>Spouse Coverage:</label>
<input type="radio" name="spouse"> Yes
<input type="radio" name="spouse"> No

<br><br>

<label>Spouse Plan Choice:</label>
<select>
    <option>Select plan</option>
    <option>Basic</option>
    <option>Standard</option>
    <option>Premium</option>
</select>

<br><br>

<label>Children Coverage:</label>
<input type="radio" name="children"> Yes
<input type="radio" name="children"> No

<br><br>

<label>Children Plan Choice:</label>
<select>
    <option>Select plan</option>
    <option>Basic</option>
    <option>Standard</option>
    <option>Premium</option>
</select>

</fieldset>

<br>

<h1>Spouse / Children Information</h1>

<label>Name:</label>
<input type="text">

<label>ID / SSN:</label>
<input type="text">

<br><br>

<label>Relationship:</label>
<select>
    <option>Select relationship</option>
    <option>Spouse</option>
    <option>Son</option>
    <option>Daughter</option>
</select>

<br><br>

<label>Birth Date:</label>
<input type="date">

<label>Age:</label>
<input type="number">

<br><br>

<label>Gender:</label>
<select>
    <option>Select gender</option>
    <option>Male</option>
    <option>Female</option>
</select>

</fieldset>

<br>

<h1>Policy Information</h1>

<label>Units:</label>
<input type="text">

<label>Annual Premium:</label>
<input type="text">

<br><br>

<label>Payment Method:</label>
<select>
    <option>Select payment method</option>
    <option>Cash</option>
    <option>Check</option>
    <option>Card</option>
</select>

<br><br>

<label>Cash With Application:</label>
<input type="text">

<label>Monthly Premium:</label>
<input type="text">


<br>

<h1>Required Document</h1 >

<label>Photo ID:</label>
<input type="file">

<br><br>

<label>Additional Document:</label>
<input type="file">



<br>

<fieldset>
<h1>Declaration</h1>

<p>
I certify that the information given above is correct.
</p>

<input type="checkbox">
<label>I agree</label>

<br><br>

<label>Applicant Full Name:</label>
<input type="text">

<label>Application Date:</label>
<input type="date">



<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</center>

</body>
</html>
